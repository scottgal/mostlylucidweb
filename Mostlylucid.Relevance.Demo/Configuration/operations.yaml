id: relevance-demo-operations-v1
filters: [available]
streams:
  actions: {kind: candidate}
  logs:
    kind: observation
    point_source: input
    weights: {measurement: 1}
points:
  latency:
    path: latency_ms
    converter: formula
    expression: "x / 1000"
    metric: l2
    displays: Mean measured response latency in seconds.
  errors:
    path: error_fraction
    converter: numeric
    metric: l2
    displays: Fraction of measured requests with failure status.
  retries:
    path: retries
    converter: numeric
    metric: l2
    displays: Mean reported retries per request.
  queue:
    path: queue_depth
    converter: formula
    expression: "x / 100"
    metric: l2
    displays: Mean reported queue depth in hundreds of items.
placements:
  diagnostics:
    heads: {latency: 1, errors: 1, retries: 1, queue: 1}
    where: {available: true}
destinations:
  states: [healthy, degraded, outage, recovered]
  outcomes: [outage, recovered]
  horizon_events: 8
  min_transitions: 10
  smoothing: 0.5
