name: Relevance packages and Native AOT
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified package set to NuGet.org
        type: boolean
        default: false
  push:
    paths:
      - 'Mostlylucid.Relevance/**'
      - 'Mostlylucid.Relevance.Sqlite/**'
      - 'Mostlylucid.Relevance.Learning/**'
      - 'Mostlylucid.Relevance.Tests/**'
      - 'Mostlylucid.Sqlite.Vector/**'
      - 'samples/RelevancePackage/**'
      - 'scripts/relevance/**'
      - 'docs/relevance/sdk/**'
      - 'dotnet-tools.json'
      - '.github/workflows/relevance-package.yml'
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and check complete SDK documentation
        run: python scripts/relevance/build-sdk-docs.py
      - uses: actions/upload-artifact@v4
        with:
          name: relevance-sdk-docs
          path: docs/relevance/sdk/_site/
      - uses: actions/upload-artifact@v4
        with:
          name: relevance-api-markdown
          path: docs/relevance/sdk/reference/
  verify:
    needs: documentation
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            library: libsqlite_vector_rs.so
          - os: macos-14
            rid: osx-arm64
            library: libsqlite_vector_rs.dylib
          - os: windows-2022
            rid: win-x64
            library: sqlite_vector_rs.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check portable repository paths
        run: python scripts/relevance/check-portable-paths.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Build pinned SQLite extension
        shell: bash
        run: scripts/relevance/build-sqlite-vector.sh '${{ matrix.rid }}'
      - name: Test managed and SQLite-owned HNSW paths
        shell: bash
        run: |
          export RELEVANCE_SQLITE_HNSW="$PWD/Mostlylucid.Sqlite.Vector/runtimes/${{ matrix.rid }}/native/${{ matrix.library }}"
          dotnet test Mostlylucid.Relevance.Tests -c Release
      - uses: actions/download-artifact@v4
        with:
          name: relevance-api-markdown
          path: docs/relevance/sdk/reference
      - name: Pack host assets and framework
        shell: bash
        run: |
          for project in Mostlylucid.Relevance Mostlylucid.Relevance.Sqlite Mostlylucid.Relevance.Learning Mostlylucid.Sqlite.Vector; do
            dotnet pack "$project" -c Release -o "$RUNNER_TEMP/feed" -p:AllowPartialNativePackage=true -p:RequireSdkDocumentation=true
          done
      - name: Publish actual NuGet consumer with Native AOT
        shell: bash
        run: |
          python scripts/relevance/write-nuget-config.py "$RUNNER_TEMP/feed" "$RUNNER_TEMP/relevance-nuget.config"
          dotnet restore samples/RelevancePackage -r '${{ matrix.rid }}' -p:UsePackedRelevance=true \
            --configfile "$RUNNER_TEMP/relevance-nuget.config"
          dotnet publish samples/RelevancePackage -c Release -r '${{ matrix.rid }}' -o "$RUNNER_TEMP/aot" -p:UsePackedRelevance=true --no-restore
      - name: Run published consumer without copying native libraries
        shell: bash
        run: |
          executable="$RUNNER_TEMP/aot/RelevancePackage"
          if [[ '${{ runner.os }}' == Windows ]]; then executable="$executable.exe"; fi
          "$executable" "$RUNNER_TEMP/exact-data"
          "$executable" "$RUNNER_TEMP/hnsw-data" bundled
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite-vector-${{ matrix.rid }}
          path: Mostlylucid.Sqlite.Vector/runtimes/
  assemble:
    needs: [verify, documentation]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          pattern: sqlite-vector-*
          path: Mostlylucid.Sqlite.Vector/runtimes
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: relevance-api-markdown
          path: docs/relevance/sdk/reference
      - uses: actions/download-artifact@v4
        with:
          name: relevance-sdk-docs
          path: artifacts/packages/docs
      - name: Pack ready-to-use framework feed and verified runtime set
        shell: bash
        run: |
          for project in Mostlylucid.Relevance Mostlylucid.Relevance.Sqlite Mostlylucid.Relevance.Learning Mostlylucid.Sqlite.Vector; do
            dotnet pack "$project" -c Release -o artifacts/packages -p:RequireSdkDocumentation=true
          done
          cat > artifacts/packages/NuGet.Config <<'CONFIG'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="relevance-preview" value="." />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          CONFIG
          cp Mostlylucid.Relevance/AGENTS.md artifacts/packages/AGENTS.md
      - name: Verify the assembled feed as a consumer would use it
        shell: bash
        run: |
          dotnet restore samples/RelevancePackage -r linux-x64 -p:UsePackedRelevance=true \
            --configfile artifacts/packages/NuGet.Config
          dotnet publish samples/RelevancePackage -c Release -r linux-x64 -p:UsePackedRelevance=true --no-restore -o "$RUNNER_TEMP/feed-consumer"
          "$RUNNER_TEMP/feed-consumer/RelevancePackage" "$RUNNER_TEMP/feed-consumer-data" bundled
      - uses: actions/upload-artifact@v4
        with:
          name: relevance-nuget-packages
          path: artifacts/packages/
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: relevance-nuget-packages
          path: packages
      - uses: NuGet/login@v1
        id: login
        with:
          user: mostlylucid
      - name: Publish the exact verified packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          for package in packages/*.nupkg; do
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
          done
