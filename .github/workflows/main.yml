name: Build, test and publish Umami.NET

on:
  push:
    branches: [main]
    paths: ['Umami.Net/**', 'Umami.Net.Test/**', '.github/workflows/main.yml']
    tags:
      - 'umamiv*.*.*'  # Triggers on tags like umamiv1.0.0, umamiv2.1.3, etc.
  pull_request:
    paths: ['Umami.Net/**', 'Umami.Net.Test/**', '.github/workflows/main.yml']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for MinVer to calculate version from tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Restore dependencies
        run: dotnet restore ./Umami.Net/Umami.Net.csproj

      - name: Build project (net8.0)
        run: dotnet build --configuration Release ./Umami.Net/Umami.Net.csproj --framework net8.0 --no-restore

      - name: Build project (net9.0)
        run: dotnet build --configuration Release ./Umami.Net/Umami.Net.csproj --framework net9.0 --no-restore

      - name: Build project (net10.0)
        run: dotnet build --configuration Release ./Umami.Net/Umami.Net.csproj --framework net10.0 --no-restore

      - name: Run tests
        run: dotnet test --configuration Release ./Umami.Net.Test/Umami.Net.Test.csproj

      - name: Verify against disposable Umami 3.4.0 and PostgreSQL
        run: |
          trap 'docker logs umami-sdk-server; docker rm -f umami-sdk-server umami-sdk-db; docker network rm umami-sdk-test' EXIT
          docker network create umami-sdk-test
          docker run -d --name umami-sdk-db --network umami-sdk-test \
            -e POSTGRES_USER=umami -e POSTGRES_PASSWORD=local-umami-only -e POSTGRES_DB=umami postgres:16-alpine
          for attempt in $(seq 1 30); do
            if docker exec umami-sdk-db pg_isready -U umami -d umami; then break; fi
            sleep 2
          done
          docker run -d --name umami-sdk-server --network umami-sdk-test -p 127.0.0.1:18086:3000 \
            -e DATABASE_URL=postgresql://umami:local-umami-only@umami-sdk-db:5432/umami \
            -e APP_SECRET=local-integration-secret-umami-review-only \
            ghcr.io/umami-software/umami:3.4.0
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18086/ >/dev/null; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then exit 1; fi
          UMAMI_TEST_URL=http://127.0.0.1:18086/ dotnet test --configuration Release \
            ./Umami.Net.Test/Umami.Net.Test.csproj --framework net10.0 --no-restore \
            --filter FullyQualifiedName~Umami34IntegrationTests

      - name: Pack project
        run: dotnet pack --configuration Release ./Umami.Net/Umami.Net.csproj --no-build --output ./nupkg

      - name: List generated packages
        run: ls -la ./nupkg

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/umamiv')
        run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.UMAMI_NUGET_API_KEY }} --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.UMAMI_NUGET_API_KEY }}
