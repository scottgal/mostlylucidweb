name: Build, test and publish Umami.NET

on:
  push:
    branches: [main]
    paths: ['Umami.Net/**', 'Umami.Net.Test/**', '.github/workflows/main.yml', 'scripts/test-umami-integration.sh']
    tags:
      - 'umamiv*.*.*'  # Triggers on tags like umamiv1.0.0, umamiv2.1.3, etc.
  pull_request:
    paths: ['Umami.Net/**', 'Umami.Net.Test/**', '.github/workflows/main.yml', 'scripts/test-umami-integration.sh']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for MinVer to calculate version from tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Restore dependencies
        run: dotnet restore ./Umami.Net/Umami.Net.csproj

      - name: Build project (net8.0)
        run: dotnet build --configuration Release ./Umami.Net/Umami.Net.csproj --framework net8.0 --no-restore

      - name: Build project (net9.0)
        run: dotnet build --configuration Release ./Umami.Net/Umami.Net.csproj --framework net9.0 --no-restore

      - name: Build project (net10.0)
        run: dotnet build --configuration Release ./Umami.Net/Umami.Net.csproj --framework net10.0 --no-restore

      - name: Run tests
        run: dotnet test --configuration Release ./Umami.Net.Test/Umami.Net.Test.csproj

      - name: Verify against disposable Umami 3.4.0 and PostgreSQL
        run: scripts/test-umami-integration.sh --configuration Release --no-restore

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umami-integration-results
          path: Umami.Net.Test/TestResults/integration/*.trx
          if-no-files-found: ignore

      - name: Pack project
        run: dotnet pack --configuration Release ./Umami.Net/Umami.Net.csproj --no-build --output ./nupkg

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: umami-release-packages
          path: |
            nupkg/*.nupkg
            nupkg/*.snupkg
          if-no-files-found: error

      - name: List generated packages
        run: ls -la ./nupkg

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/umamiv')
        run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.UMAMI_NUGET_API_KEY }} --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.UMAMI_NUGET_API_KEY }}

  github-release:
    if: startsWith(github.ref, 'refs/tags/umamiv')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged release
        uses: actions/checkout@v4

      - name: Download the published packages
        uses: actions/download-artifact@v4
        with:
          name: umami-release-packages
          path: nupkg

      - name: Bundle release documentation
        run: |
          mkdir release-docs
          cp Umami.Net/README.md release-docs/Umami.Net-README.md
          cp Umami.Net/MIGRATION.md release-docs/Umami.Net-Migration.md
          cp Umami.Net/REVIEW.md release-docs/Umami.Net-Review.md
          cp Umami.Net/RELEASE.md release-docs/Umami.Net-Release.md
          cp Umami.Net/ReleaseNotes.txt release-docs/Umami.Net-ReleaseNotes.txt
          cp Umami.Net.Test/Integration/README.md release-docs/Umami.Net-Integration-Tests.md
          zip -j Umami.Net-docs.zip release-docs/*

      - name: Create versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" nupkg/*.nupkg nupkg/*.snupkg Umami.Net-docs.zip \
            --verify-tag --title "Umami.Net ${GITHUB_REF_NAME#umamiv}" \
            --notes-file Umami.Net/RELEASE.md --latest=false
